<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PipelineX AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- ✅ Flask static folder reference -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="grid-bg"></div>

    <!-- ✅ Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="container">
        <div style="text-align: center; margin-bottom: 20px;">
            <div class="logo">PipelineX AI</div>
        </div>

        <h2 style="text-align: center; margin-bottom: 10px;">Create Account</h2>
        <p style="text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 25px;">
            Start Automating ML Workflows
        </p>

        <!-- ✅ POST to the correct /register route -->
        <form action="{{ url_for('register') }}" method="POST">
            <div class="input-group">
                <input type="text" name="name" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            </div>
            <button type="submit">Create Account</button>
        </form>

        <p style="margin-top: 20px; text-align: center; font-size: 13px;">
            Already have an account?
            <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none;">Login</a>
        </p>

        <p style="margin-top: 10px; text-align: center; font-size: 13px;">
            <a href="{{ url_for('home') }}" style="color: var(--text-dim); text-decoration: none;">← Back to Home</a>
        </p>
    </div>
</body>
</html>
