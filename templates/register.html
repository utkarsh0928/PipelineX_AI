<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | PipelineX AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="bg-base"></div>
    <div class="bg-dots"></div>
    <div class="bg-scanlines"></div>
    <canvas id="neural-canvas"></canvas>
    <div class="ml-tags" id="ml-tags"></div>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div class="flash-messages">
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}

    <div class="auth-page">
      <div class="container">
        <div class="container-logo">
          <div class="logo-text">PipelineX AI</div>
        </div>

        <h2>Create Account</h2>
        <p class="sub-heading">Start automating ML workflows</p>

        <form action="{{ url_for('register') }}" method="POST">
          <div class="input-group">
            <input type="text" name="name" placeholder="Full Name" required />
          </div>
          <div class="input-group">
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
            />
          </div>
          <div class="input-group">
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>
          <div class="input-group">
            <input
              type="password"
              name="confirm_password"
              placeholder="Confirm Password"
              required
            />
          </div>
          <button type="submit">Create Account →</button>
        </form>

        <p class="form-footer">
          Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
        </p>
        <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
      </div>
    </div>

    <script>
      (function () {
        const canvas = document.getElementById("neural-canvas");
        const ctx = canvas.getContext("2d");
        let W,
          H,
          nodes = [];
        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);
        const count = Math.floor(
          (window.innerWidth * window.innerHeight) / 14000,
        );
        for (let i = 0; i < count; i++)
          nodes.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            r: Math.random() * 2 + 1.5,
            pulse: Math.random() * Math.PI * 2,
            color: Math.random() > 0.5 ? "0,229,255" : "124,58,237",
          });
        function draw() {
          ctx.clearRect(0, 0, W, H);
          nodes.forEach((n) => {
            n.x += n.vx;
            n.y += n.vy;
            n.pulse += 0.018;
            if (n.x < 0 || n.x > W) n.vx *= -1;
            if (n.y < 0 || n.y > H) n.vy *= -1;
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 4);
            g.addColorStop(0, `rgba(${n.color},0.9)`);
            g.addColorStop(1, `rgba(${n.color},0)`);
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + Math.sin(n.pulse) * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
          });
          for (let i = 0; i < nodes.length; i++)
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i],
                b = nodes[j],
                dx = a.x - b.x,
                dy = a.y - b.y,
                d = Math.sqrt(dx * dx + dy * dy);
              if (d < 140) {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `rgba(0,229,255,${(1 - d / 140) * 0.35})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
              }
            }
          requestAnimationFrame(draw);
        }
        draw();
      })();
      (function () {
        const tags = [
          "new Pipeline()",
          "user.register()",
          "hash_password()",
          "db.session.add()",
          "create_user()",
          "validate_email()",
          "session.commit()",
          "check_password_hash()",
          "redirect(dashboard)",
        ];
        const c = document.getElementById("ml-tags");
        tags.forEach((t) => {
          const el = document.createElement("div");
          el.className = "ml-tag";
          el.textContent = t;
          el.style.left = 3 + Math.random() * 92 + "%";
          el.style.animationDuration = 18 + Math.random() * 22 + "s";
          el.style.animationDelay = -(Math.random() * 30) + "s";
          c.appendChild(el);
        });
      })();
    </script>
  </body>
</html>
