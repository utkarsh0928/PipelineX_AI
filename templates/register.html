<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Register | PipelineX AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg-base"></div><div class="bg-dots"></div><div class="bg-scanlines"></div>

{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-messages">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
<div class="auth-page">
  <div class="container">
    <div class="container-logo"><div class="logo-text">Pipeline<span>X</span> AI</div></div>
    <h2>Create Account</h2>
    <p class="sub-heading">Start automating ML workflows</p>
    <form action="{{ url_for('register') }}" method="POST">
      <div class="input-group"><input type="text" name="name" placeholder="Full Name" required></div>
      <div class="input-group"><input type="email" name="email" placeholder="Email Address" required></div>
      <div class="input-group"><input type="password" name="password" placeholder="Password" required></div>
      <div class="input-group"><input type="password" name="confirm_password" placeholder="Confirm Password" required></div>
      <button type="submit">Create Account →</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p>
    <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
  </div>
</div>

</body></html>
